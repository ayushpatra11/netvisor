# .golangci.yml — golangci-lint configuration
# Docs: https://golangci-lint.run/usage/configuration/
#
# Philosophy: start strict, relax deliberately. Following based on Canonical code practices 

run:
  timeout: 5m
  skip-dirs:
    - proto
  # Only lint files that changed vs main — faster on large repos.
  # Remove this if you want to lint everything always.

linters:
  # Disable all defaults, enable only what we explicitly list.
  # This avoids surprise failures when golangci-lint adds new linters.
  disable-all: true
  enable:
    - errcheck      # Ensures you handle every returned error — critical in Go
    - gosimple      # Suggests simpler code constructs
    - govet         # Same as `go vet` — catches suspicious code patterns
    - ineffassign   # Catches assignments whose values are never used
    - staticcheck   # Powerful static analysis (similar to a second compiler)
    - unused        # Flags unexported identifiers that are never used
    - gofmt         # Enforces standard Go formatting (no tabs vs spaces debates)
    - goimports     # Like gofmt but also organises import groups
    - misspell      # Catches common English misspellings in comments/strings
    - gocritic      # Opinionated but useful style checks
    - noctx         # Flags HTTP requests made without a context

linters-settings:
  errcheck:
    # By default errcheck ignores errors from fmt.Print* and similar.
    # Set to false to catch those too — useful for production code.
    check-type-assertions: true

  govet:
    enable:
      - shadow    # Catches variables that shadow outer-scope variables
                  # e.g. `err` declared inside an if block shadowing outer `err`

  goimports:
    # Group imports: stdlib first, then external, then internal.
    # This matches the style used by LXD and containerd.
    local-prefixes: github.com/yourusername/netvisor

issues:
  # Don't fail on generated files (protobuf output etc)
  exclude-rules:
    - path: ".*\\.pb\\.go"
      linters: [all]
    - path: "_test\\.go"
      linters: [errcheck]   # Test files routinely ignore errors in cleanup
