name: CI

# Trigger on every push and every pull request.
# This means: your own branch pushes AND when someone opens a PR against main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  # Catches style issues, suspicious patterns, and common bugs BEFORE tests run.
  # Fail fast: no point running 5-min tests if there's a lint error.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # Cache the Go module download cache between runs.
          # Without this, every run re-downloads all dependencies (~30s wasted).
          cache: true

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

  # ── 2. Test ────────────────────────────────────────────────────────────────
  # Matrix: run tests on multiple Go versions so you catch version-specific issues.
  # This is how libraries like cobra and zap guarantee backward compatibility.
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: lint   # Only run tests if lint passes — saves CI minutes

    strategy:
      matrix:
        go-version: ["1.21", "1.22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (with race detector)
        run: go test -race -count=1 ./...

  # ── 3. Build ───────────────────────────────────────────────────────────────
  # Cross-compile for all target platforms.
  # GOOS/GOARCH are Go's cross-compilation env vars — no toolchain needed.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64   # MAAS often runs on ARM servers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"   # Disable CGo for a fully static binary — no libc dependency
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build \
            -ldflags "-X main.version=${VERSION} -s -w" \
            -o bin/netvisor-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/netvisor

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: netvisor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/netvisor-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
